# Managed service pilot. One writer only. An HTTPS reverse proxy is configured separately.
services:
  notion:
    build:
      context: ../..
      dockerfile: integrations/notion/Dockerfile
      target: managed
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    volumes:
      - "${NOTION_PRIVATE_DIR:?Set the absolute owner-private configuration directory}/notion-managed.json:/etc/eat-or-yeet/notion-managed.json:ro"
      - "${NOTION_PRIVATE_DIR:?Set the absolute owner-private configuration directory}/secrets:/run/secrets:ro"
      - "notion-state:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  notion-state:
