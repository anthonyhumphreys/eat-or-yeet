services:
  fsis-sync:
    build:
      context: ../..
      dockerfile: deploy/fsis-sync/Dockerfile
    image: eat-or-yeet-fsis-sync:local
    restart: unless-stopped
    init: true
    environment:
      FSIS_BACKEND_URL: ${FSIS_BACKEND_URL:?Set FSIS_BACKEND_URL to the Cloudflare backend URL}
      FDA_ANNOUNCEMENTS_SYNC_ENABLED: "true"
    secrets:
      - fsis_upload_token
      - fda_upload_token
    volumes:
      - sync-state:/var/lib/fsis-sync
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 35m
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/fsis-sync-worker.ts", "--healthcheck"]
      interval: 5m
      timeout: 15s
      start_period: 35m
      retries: 1
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

secrets:
  fsis_upload_token:
    file: ./secrets/fsis-upload-token
  fda_upload_token:
    file: ./secrets/fda-upload-token

volumes:
  sync-state:
