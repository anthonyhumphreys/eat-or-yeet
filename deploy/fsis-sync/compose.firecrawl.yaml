# Optional detail-page pilot. The FDA listing and USDA API still use the home connection.
services:
  fsis-sync:
    environment:
      FDA_ANNOUNCEMENTS_DETAIL_FETCH_MODE: firecrawl
      FIRECRAWL_API_KEY_FILE: /run/secrets/firecrawl_api_key
    secrets:
      - firecrawl_api_key

secrets:
  firecrawl_api_key:
    file: ./secrets/firecrawl-api-key
